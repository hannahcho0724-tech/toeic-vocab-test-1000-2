<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>해커스 토익 실전 1000제 2 by 조해나선생님 LC단어학습 Guide - TEST 03</title><style>
:root{--primary:#8f4b8b;--primary2:#34213a;--bg:#f7f4f8;--ink:#251d2b;--muted:#716679;--line:#e8e0ea;}

.result{padding:16px;border-radius:12px;background:#f5f1f6;margin-top:14px}.correct{border-color:#86efac;background:#f0fdf4}.wrong{border-color:#fecaca;background:#fef2f2}.model-answer{margin-top:9px;color:#5f5465;font-size:14px}

.test-link:hover{border-color:#b9a6bd;transform:translateY(-1px);box-shadow:0 5px 14px rgba(54,33,59,.07)}
.test-link b{font-size:18px;color:var(--primary)}.test-link span{display:block;color:#716679;margin-top:5px;font-size:14px}
.note{font-size:13px;color:#716679;line-height:1.6}.count-ok{color:#027a48;font-weight:800}

의, 부가적인"},{"en":"regulation","ko":"규정, 규제"},{"en":"nomination","ko":"후보"},{"en":"highly","ko":"고도로"},{"en":"enroll","ko":"입학시키다"},{"en":"pull off","ko":"빠져나오다"},{"en":"last-minute","ko":"최종적인, 막바지의"},{"en":"celebration","ko":"축하"},{"en":"fill up","ko":"가득 채우다"},{"en":"lean","ko":"기울다"},{"en":"editing","ko":"편집"},{"en":"word processing","ko":"문서 작성"},{"en":"prioritize","ko":"우선시하다"},{"en":"portability","ko":"휴대성"},{"en":"affordability","ko":"감당할 수 있는 비용"},{"en":"management","ko":"경영진"},{"en":"take part","ko":"참여하다"},{"en":"specialist","ko":"전문가"},{"en":"establish","ko":"설립하다"},{"en":"autograph","ko":"사인"},{"en":"physically disabled","ko":"신체적으로 장애가 있는"},{"en":"proof of purchase","ko":"구매 증명서"},{"en":"identification card","ko":"신분증"},{"en":"meet","ko":"충족하다"},{"en":"standard","ko":"기준, 표준"},{"en":"income","ko":"소득"},{"en":"be eligible for","ko":"~에 대한 자격을 갖다"},{"en":"exclusive","ko":"독점적인, 배타적인"},{"en":"authorization","ko":"승인"},{"en":"high-interest","ko":"고리(高利)의, 이자가 높은"},{"en":"overseas","ko":"해외로"}],"D":[{"en":"security check","ko":"보안 검사"},{"en":"make an appearance","ko":"출연하다"},{"en":"all by oneself","ko":"혼자"},{"en":"occasion","ko":"기회, 경우"},{"en":"cabin","ko":"객실"},{"en":"satisfactory","ko":"만족스러운"},{"en":"cruise","ko":"유람선 여행"},{"en":"outdated","ko":"구식인"},{"en":"ballroom","ko":"연회장"},{"en":"auditorium","ko":"강당"},{"en":"beforehand","ko":"~전에 미리, 사전에"},{"en":"standing room","ko":"서 있을 수 있는 공간"},{"en":"overbook","ko":"(비행기 좌석, 호텔 객실) 정원 이상으로 예약을 받다"},{"en":"organizer","ko":"주최자, 조직자"},{"en":"founder","ko":"설립자, 창업자"},{"en":"merchandise","ko":"상품"},{"en":"reach","ko":"연락하다, 도달하다"},{"en":"business hour","ko":"영업시간"},{"en":"at no charge","ko":"무료로"},{"en":"instructor","ko":"강사"},{"en":"qualify for","ko":"자격을 얻다"},{"en":"admission","ko":"입장, 가입"},{"en":"complimentary","ko":"무료의"},{"en":"storage locker","ko":"보관함"},{"en":"marine biologist","ko":"해양 생물학자"},{"en":"prestigious","ko":"권위 있는, 명망 있는"},{"en":"coral","ko":"산호"},{"en":"species","ko":"종"},{"en":"educational","ko":"유익한, 교육적인"},{"en":"audience","ko":"방청객"},{"en":"partner with","ko":"~와 협력하다"},{"en":"threat","ko":"위협, 협박"},{"en":"constraint","ko":"제약"},{"en":"modest","ko":"검소한, 수수한"},{"en":"exception","ko":"예외"},{"en":"journal","ko":"일기, 정기 간행물"},{"en":"property","ko":"건물, 재산"},{"en":"display board","ko":"게시판"},{"en":"necessary","ko":"필수의"},{"en":"public transportation","ko":"대중교통"},{"en":"challenging","ko":"힘든, 도전적인"},{"en":"insurance","ko":"보험"},{"en":"paperwork","ko":"서류 작업"},{"en":"milestone","ko":"중요한 시점"},{"en":"feature","ko":"특별히 포함하다, 특징으로 삼다"},{"en":"coordinate with","ko":"~와 협력하다"},{"en":"aside from","ko":"~을 제외하고"},{"en":"fund-raising","ko":"기금 모금"},{"en":"give away","ko":"기부하다"},{"en":"give a talk","ko":"강연하다"}]}};window.TEST_PRIMARY="#9b4f96";</script>
<script>
const DATA=window.TEST_DATA;
const primary=window.TEST_PRIMARY;document.documentElement.style.setProperty('--primary',primary);
const allWords=Object.values(DATA.sections).flat();
let currentQuiz=[];let currentType='';
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function show(id){document.querySelectorAll('[data-view]').forEach(x=>x.classList.add('hidden'));document.getElementById(id).classList.remove('hidden');window.scrollTo({top:0,behavior:'smooth'});}
function backHome(){show('home');}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function renderVocab(sec='ALL'){
 show('vocab');const box=document.getElementById('vocabBody');let rows=[];
 if(sec==='ALL'){Object.entries(DATA.sections).forEach(([s,arr])=>arr.forEach((w,i)=>rows.push([s,i+1,w])))}else DATA.sections[sec].forEach((w,i)=>rows.push([sec,i+1,w]));
 box.innerHTML=`<table><thead><tr><th class="n">구분</th><th>영어 어휘</th><th>뜻</th></tr></thead><tbody>${rows.map(([s,i,w])=>`<tr><td><span class="badge">${s}-${i}</span></td><td><b>${esc(w.en)}</b></td><td>${esc(w.ko)}</td></tr>`).join('')}</tbody></table>`;
 document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.sec===sec));
}
function makeQuiz(type,count=40){
 currentType=type;currentQuiz=shuffle(allWords).slice(0,Math.min(count,allWords.length));show('quiz');
 document.getElementById('quizTitle').textContent=type==='choice'?'랜덤 4지선다 퀴즈':'랜덤 주관식 퀴즈';
 document.getElementById('quizMeta').textContent=`${currentQuiz.length}문항 · TEST ${String(DATA.test).padStart(2,'0')} 전체 200개에서 출제`;
 const area=document.getElementById('quizBody');
 if(type==='choice'){
   area.innerHTML=currentQuiz.map((w,i)=>{
     let wrong=shuffle(allWords.filter(x=>x.en!==w.en && x.ko!==w.ko)).slice(0,3);
     let opts=shuffle([...wrong,w]);
     return `<div class="card" data-answer="${esc(w.ko)}"><b>${i+1}. 다음 단어의 알맞은 뜻은?</b><div class="qword">${esc(w.en)}</div><div class="choices">${opts.map((o,j)=>`<label class="choice"><input type="radio" name="q${i}" value="${esc(o.ko)}">${['①','②','③','④'][j]} ${esc(o.ko)}</label>`).join('')}</div><div class="model-answer hidden"></div></div>`;
   }).join('');
 }else{
   area.innerHTML=currentQuiz.map((w,i)=>`<div class="card" data-answer="${esc(w.ko)}"><b>${i+1}.</b><div class="qword">${esc(w.en)}</div><input class="answer" placeholder="뜻을 입력해 보세요 (제출 후 모범답안 확인)"/><div class="model-answer hidden"></div></div>`).join('');
 }
 document.getElementById('quizResult').classList.add('hidden');document.getElementById('submitBtn').disabled=false;
}
function submitQuiz(){
 let score=0,answered=0;
 document.querySelectorAll('#quizBody .card').forEach((card,i)=>{
   const ans=card.dataset.answer;const ma=card.querySelector('.model-answer');
   ma.classList.remove('hidden');ma.textContent='모범답안: '+ans;
   if(currentType==='choice'){
     const sel=card.querySelector('input:checked');
     if(sel){answered++;if(sel.value===ans){score++;card.classList.add('correct')}else card.classList.add('wrong')}
   }else{
     const inp=card.querySelector('input.answer');if(inp.value.trim())answered++;
   }
 });
 const r=document.getElementById('quizResult');r.classList.remove('hidden');
 r.innerHTML=currentType==='choice'
 ?`<b>채점 결과: ${score} / ${currentQuiz.length}</b><br><span class="note">응답 ${answered}문항. 각 문항 아래에 모범답안이 표시됩니다.</span>`
 :`<b>주관식 답안 공개 완료</b><br><span class="note">주관식은 표현이 다양하므로 자동채점하지 않고, 입력 답안과 모범답안을 직접 비교하도록 구성했습니다.</span>`;
 document.getElementById('submitBtn').disabled=true;r.scrollIntoView({behavior:'smooth'});
}
</script></body></html>
